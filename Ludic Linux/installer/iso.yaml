label: "Ludic-Live"
grub2:
  default: 0
  timeout: 5
  entries:
    - name: "Try Ludic (live desktop)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Ludic-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Try Ludic (basic graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=Ludic-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
